name: Feature request
description: Suggest an improvement or a new capability.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the product. Please describe the problem first, rather than only proposing a solution.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to accomplish, and what makes it difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like the product to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Are there existing workarounds or other approaches?
    validations:
      required: false
  - type: textarea
    id: additional-information
    attributes:
      label: Additional context
      description: Examples, mockups, or other useful details.
    validations:
      required: false
  - type: checkboxes
    id: confirmation
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for similar requests.
          required: true
